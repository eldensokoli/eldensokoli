name: Full-year calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Full-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugins.svg
          # METRICS_TOKEN (classic PAT: repo, read:org, read:user) is needed to see the
          # private Stackmeisterei repos; the action token only sees public ones
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: Europe/Berlin
          # include org repos, not just the ones eldensokoli owns
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          # no recently-used: that analyzer crashes on GitHub's current push-event payloads
          plugin_languages_sections: most-used
